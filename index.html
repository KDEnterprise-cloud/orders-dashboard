<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KD Enterprise · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #150d2e;
    color: #ffffff;
    min-height: 100vh;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    padding: 20px;
  }

  /* Ambient gradient blobs */
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .5;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #6366f1, transparent 70%);
    top: -200px; left: -200px;
    animation: float 18s ease-in-out infinite;
  }
  body::after {
    width: 700px; height: 700px;
    background: radial-gradient(circle, #f59e0b, transparent 70%);
    bottom: -300px; right: -200px;
    animation: float 22s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, -40px) scale(1.1); }
  }

  /* Login card */
  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(45, 27, 105, 0.55);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(150, 130, 255, 0.25);
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    animation: cardIn .5s cubic-bezier(.2, .9, .3, 1.2);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Logo */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }
  .logo-mark {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, #6366f1, #f59e0b);
    display: grid;
    place-items: center;
    font-size: 36px;
    box-shadow: 0 16px 40px rgba(99, 102, 241, 0.5);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 16px 40px rgba(99, 102, 241, 0.5); }
    50%      { box-shadow: 0 16px 60px rgba(245, 158, 11, 0.6); }
  }
  .logo-title {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -.5px;
    background: linear-gradient(135deg, #ffffff, #d4d0f0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-sub {
    font-size: 12.5px;
    color: #a89fd8;
    font-weight: 500;
    letter-spacing: .3px;
  }

  /* Form */
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    font-size: 11.5px;
    font-weight: 800;
    color: #d4d0f0;
    text-transform: uppercase;
    letter-spacing: .6px;
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(60, 38, 130, 0.4);
    border: 1px solid rgba(150, 130, 255, 0.2);
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #ffffff;
    outline: none;
    transition: all .2s;
    letter-spacing: .3px;
  }
  .field input::placeholder {
    color: #6b5f96;
    font-weight: 500;
  }
  .field input:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, .25);
    background: rgba(60, 38, 130, 0.6);
  }
  .field input[readonly] {
    background: rgba(45, 27, 105, 0.5);
    cursor: not-allowed;
    opacity: .9;
  }

  /* Password wrapper with eye */
  .pw-wrap {
    position: relative;
  }
  .pw-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #a89fd8;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    transition: color .15s;
  }
  .pw-toggle:hover { color: #ffffff; }
  .pw-toggle svg { width: 18px; height: 18px; }

  /* Button */
  .btn-login {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #ffffff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: .5px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 12px 32px rgba(99, 102, 241, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 44px rgba(99, 102, 241, 0.55);
  }
  .btn-login:active {
    transform: translateY(0);
  }
  .btn-login:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
  }
  .btn-login svg { width: 18px; height: 18px; }

  /* Error message */
  .error {
    display: none;
    margin-top: 14px;
    padding: 12px 16px;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 10px;
    color: #fca5a5;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    animation: shake .4s;
  }
  .error.show { display: block; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }

  /* Footer */
  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 11.5px;
    color: #6b5f96;
    font-weight: 500;
  }
  .footer strong {
    color: #a89fd8;
    font-weight: 700;
  }

  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; border-radius: 20px; }
    .logo-mark { width: 60px; height: 60px; font-size: 30px; }
    .logo-title { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="login-card">

  <div class="logo">
    <div class="logo-mark">👑</div>
    <div style="text-align:center">
      <div class="logo-title">KD Enterprise</div>
      <div class="logo-sub">Orders Manager</div>
    </div>
  </div>

  <form id="loginForm" autocomplete="off">

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" value="KD ENTERPRISE" readonly>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="off" autofocus>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" class="btn-login" id="loginBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      Sign In
    </button>

    <div class="error" id="error">❌ Incorrect password. Try again.</div>

  </form>

  <div class="footer">
    🔒 Private admin access · <strong>KD Enterprise</strong>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   🔐 CREDENTIALS — Change the password below if needed
   ═══════════════════════════════════════════════════════════ */
const CORRECT_PASSWORD = "Kaiserder@2026";

/* ═══════════════════════════════════════════════════════════
   🎯 WHERE TO GO AFTER LOGIN
   ═══════════════════════════════════════════════════════════ */
const ORDERS_URL = "https://kdenterprise-cloud.github.io/orders-dashboard/";

/* ═══════════════════════════════════════════════════════════ */
const form = document.getElementById("loginForm");
const pwInput = document.getElementById("password");
const errorBox = document.getElementById("error");
const loginBtn = document.getElementById("loginBtn");

// Show/hide password
document.getElementById("pwToggle").addEventListener("click", () => {
  pwInput.type = pwInput.type === "password" ? "text" : "password";
  pwInput.focus();
});

// Handle login
form.addEventListener("submit", (e) => {
  e.preventDefault();
  const entered = pwInput.value;

  if (entered === CORRECT_PASSWORD) {
    // Success — show loading state
    loginBtn.disabled = true;
    loginBtn.innerHTML = "✅ Access granted — opening…";

    // Save session so we don't ask every time (per tab)
    sessionStorage.setItem("kd_logged_in", "1");

    // Redirect to Orders Manager
    setTimeout(() => {
      window.location.href = ORDERS_URL;
    }, 500);
  } else {
    // Wrong password
    errorBox.classList.add("show");
    pwInput.value = "";
    pwInput.focus();
    errorBox.style.animation = "none";
    setTimeout(() => errorBox.style.animation = "", 10);
  }
});

// Hide error when user types again
pwInput.addEventListener("input", () => {
  errorBox.classList.remove("show");
});
</script>

</body>
</html>
